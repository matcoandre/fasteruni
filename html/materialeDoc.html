<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>
        Materiali/dispense - Docente
      </title>

      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
      <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

      <link rel="icon" type="image/png" href="../media/logos/app_colored.png">

      <style>
      @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');
      
      body
      {
        font-family: 'Lato', sans-serif;
      }

      footer
      {
        position: fixed;
        left: auto;
        bottom: 20px;
        width: 10%;
        @apply flex justify-center
      }

      button
      {
        @apply text-center dark:text-neutral-200 text-neutral-700 font-light text-xl border-2 rounded-lg max-w-lg w-10 flex-1 border-neutral-200 dark:border-neutral-700 hover:scale-105 transform transition-all;
      }

      input, select{
        @apply border-2 dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 mt-1 placeholder-white
      }

      ::placeholder
      {
        @apply text-center
      }
      </style>
  </head>
  <body class="min-h-screen h-full flex flex-col items-center justify-center bg-cover" background="../media/1.jpg">
    <main class="flex flex-col bg-white dark:bg-neutral-900 dark:text-white p-2 rounded-lg space-y-2">
      <h1 class="text-2xl font-semibold dark:text-neutral-100 text-neutral-900 text-center">Carica materiale</h1>
      <select id="insegnante" class="dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 placeholder-white" required>
        <option selected disabled>Seleziona un corso...</option>
        <option>Diritto internazionale</option>
        <option>Fondamenti di elettronica</option>
        <option>Logica matematica</option>
      </select>
      
      <input id="description" type="text" class="border-2 dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 mt-1" placeholder="Inserisci descrizione" required> 
      <form action="../php/upload.php" method="post" enctype="multipart/form-data">
        Select image to upload:
        <input type="file" name="fileToUpload" id="fileToUpload">
        <input type="submit" value="Upload Image" name="submit">
      </form>
      <div id = "snackbar"></div>
    </main>
    <footer>
      <img src="../media/logos/xenodev_round_white.png">
    </footer>
  </body>
</html>
