<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>
        Inserimento lezioni - Docente
      </title>

      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
      <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
      <script src="../js/script.js"></script>

      <link rel="icon" type="image/png" href="../media/logos/app_colored.png">
      
      <style>
      @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');
      
      #snackbar {
        visibility: hidden;
        min-width: 250px;
        margin-left: -125px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 2px;
        padding: 16px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 70px;
        font-size: 17px;
      }

      #snackbar.show 
      {
        visibility: visible;
        -webkit-animation: fadein 1.0s, fadeout 1.0s 4.0s;
        animation: fadein 1.0s, fadeout 1.0s 4.0s;
      }

      @-webkit-keyframes fadein 
      {
        from {bottom: 0; opacity: 0;} 
        to {bottom: 70px; opacity: 1;}
      }

      @keyframes fadein 
      {
        from {bottom: 0; opacity: 0;}
        to {bottom: 70px; opacity: 1;}
      }

      @-webkit-keyframes fadeout 
      {
        from {bottom: 70px; opacity: 1;} 
        to {bottom: 0; opacity: 0;}
      }

      @keyframes fadeout 
      {
        from {bottom: 70px; opacity: 1;}
        to {bottom: 0; opacity: 0;}
      }

      body
      {
        font-family: 'Lato', sans-serif;
      }

      footer
      {
        position: fixed;
        left: auto;
        bottom: 20px;
        width: 10%;
        @apply flex justify-center
      }

      button
      {
        @apply mt-5 text-center dark:text-neutral-200 text-neutral-700 font-light text-xl border-2 rounded-lg max-w-lg w-36 flex-1 border-neutral-200 dark:border-neutral-700 hover:scale-105 transform transition-all;
      }

      input, select{
        @apply border-2 dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 mt-1
      }

      ::placeholder
      {
        @apply text-center dark:text-black text-white
      }
      </style>
  </head>
  <body class="min-h-screen h-full flex flex-col items-center justify-center bg-cover" background="../media/1.jpg">
    <main class="flex flex-col bg-white dark:bg-neutral-900 dark:text-white p-2 rounded-lg space-y-2">
      <h1 class="text-2xl font-semibold dark:text-neutral-100 text-neutral-900 text-center">Inserisci lezione</h1>
      <select id="corso" class="dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 placeholder-white" required>
        <option selected disabled>Seleziona un corso...</option>
        <option>Diritto internazionale</option>
        <option>Fondamenti di elettronica</option>
        <option>Logica matematica</option>
      </select>
      
      <input id="description" type="text" name="description" class="dark:border-2 dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 mt-1 w-full" placeholder="Inserisci descrizione" required> 
      
      <input id="data" type="date" name="date" class="dark:border-2 dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 mt-1 w-full" required>

      <section class="flex flex-grow space-x-2 items-center justify-center">
        <button type="button" class="text-center dark:text-neutral-200 text-neutral-700 font-light text-xl border-2 rounded-lg max-w-lg w-36 flex-1 border-neutral-200 dark:border-neutral-700 hover:scale-105 transform transition-all" onclick="notificaScomparsa('Lezione inserita con successo!')">Inserisci</button>
      </section>
      <div id = "snackbar"></div>
    </main>
    <footer>
      <img src="../media/logos/xenodev_round_white.png">
    </footer>
  </body>
  <script>
    $( "#mese" )
      .change(function () {
      var str = "";
      $( "#mese option:selected" ).each(function() {
        if (this.text == "febbraio")         
        {
          $("option[value='29']").remove()
          $("option[value='30']").remove()
          $("option[value='31']").remove()
        }
        else if (this.text == "novembre" || this.text == "aprile" || this.text == "giugno" || this.text == "settembre")
        {
          $("option[value='31']").remove()
        }
      });
    })
    .change();
  </script>
</html>
