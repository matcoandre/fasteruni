<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>
        Valutazioni - Docente
      </title>

      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
      <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
      <script src="../js/script.js"></script>

      <link rel="icon" type="image/png" href="../media/logos/app_colored.png">

      <style>
      @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');
	  
      #snackbar {
        visibility: hidden;
        min-width: 250px;
        margin-left: -125px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 2px;
        padding: 16px;
        position: fixed;
        z-index: 1;
        left: 50%;
        bottom: 70px;
        font-size: 17px;
      }

      #snackbar.show 
      {
      visibility: visible;
      -webkit-animation: fadein 1.0s, fadeout 1.0s 4.0s;
      animation: fadein 1.0s, fadeout 1.0s 4.0s;
        }

      @-webkit-keyframes fadein 
      {
      from {bottom: 0; opacity: 0;} 
      to {bottom: 70px; opacity: 1;}
      }

      @keyframes fadein 
      {
      from {bottom: 0; opacity: 0;}
      to {bottom: 70px; opacity: 1;}
      }

      @-webkit-keyframes fadeout 
      {
      from {bottom: 70px; opacity: 1;} 
      to {bottom: 0; opacity: 0;}
      }

      @keyframes fadeout 
      {
      from {bottom: 70px; opacity: 1;}
      to {bottom: 0; opacity: 0;}
      }
      
      body
      {
        font-family: 'Lato', sans-serif;
      }

      footer
      {
        position: fixed;
        left: auto;
        bottom: 20px;
        width: 10%;
        @apply flex justify-center
      }

      button
      {
        @apply mt-5 text-center dark:text-neutral-200 text-neutral-700 font-light text-xl border-2 rounded-lg max-w-lg w-36 flex-1 border-neutral-200 dark:border-neutral-700 hover:scale-105 transform transition-all;
      }

      input, select{
        @apply border-2 dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 mt-1 placeholder-white
      }

      ::placeholder
      {
        @apply text-center
      }
      </style>
  </head>
  <body class="min-h-screen h-full flex flex-col items-center justify-center bg-cover" background="../media/1.jpg">
    <main class="flex flex-col items-center justify-center bg-white dark:bg-neutral-900 dark:text-white p-2 rounded-lg">
      <h1 class="mb-4 text-2xl font-semibold dark:text-neutral-100 text-neutral-900 text-center">Inserisci valutazione</h1>
      <section class="flex flex-grow items-center justify-center space-x-2">
        <select id="course" class="dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 placeholder-white" required>
          <option selected disabled>Seleziona un corso</option>
          <option>Diritto internazionale</option>
          <option>Fondamenti di elettronica</option>
          <option>Logica matematica</option>
        </select>  
        <select id="stud" class="dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 placeholder-white" required>
          <option selected disabled>Seleziona studente</option>
          <option>Pino Insegna</option>
          <option>Gino Storti</option>
          <option>Alfonso Signorini</option>
        </select>   
        <select id="voto" class="dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 placeholder-white" required>
          <option selected disabled>Seleziona voto</option>
          <option>18</option>
          <option>19</option>
          <option>20</option>
          <option>21</option>
          <option>22</option>
          <option>23</option>
          <option>24</option>
          <option>25</option>
          <option>26</option>
          <option>27</option>
          <option>28</option>
          <option>29</option>
          <option>30</option>
          <option>30 e lode</option>
        </select>   
        <select id="tipologia" class="dark:border-neutral-800 bg-white dark:bg-neutral-700 dark:text-white rounded-lg px-1 placeholder-white" required>
          <option selected disabled>Seleziona tipologia</option>
          <option>Scritto</option>
          <option>Orale</option>
          <option>Pratico</option>
        </select>
        <button id="bottone" class="text-center dark:text-neutral-200 text-neutral-700 font-light border-2 rounded-lg max-w-lg w-36 flex-1 border-neutral-200 dark:border-neutral-700 hover:scale-105" onclick="notificaScomparsa('Voto inserito con successo!')">Invia voto</button>
      </section>
	  <div id = "snackbar"></div>
    </main>
    <footer>
      <img src="../media/logos/xenodev_round_white.png">
    </footer>
  </body>
  <script>
    // STUDENTE SHOW
    $( "#course" )
      .change(function () {
        $( "#course option:selected" ).each(function() {
          if (this.text == "Seleziona un corso")
          {
            $("#stud").hide()
          }
          else
          {
            $("#stud").show()
          }
        });
      })
    .change();

    // VOTO SHOW 
    $( "#stud" )
      .change(function () {
      $( "#stud option:selected" ).each(function() {
        if (this.text == "Seleziona studente")
        {
          $("#voto").hide()
        }
        else
        {
          $("#voto").show()
        }
      });
    })
    .change();
    
    // BUTTON SHOW
    
    $( "#voto" )
    .change(function () {
      $( "#voto option:selected" ).each(function() {
      if (this.text != "Seleziona voto")
        {
          $("#tipologia").show()
        }
        else
        {
          $("#tipologia").hide()
        }
      });
    })
    .change();
    
    // BUTTON SHOW
    
    $( "#tipologia" )
    .change(function () {
      $( "#tipologia option:selected" ).each(function() {
        if (this.text == "Seleziona tipologia")
        {
          $("#bottone").hide()
        }
        else
        {
          $("#bottone").show()
        }
      });
    })
    .change();
  </script>
</html>
